<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2430">
<title>寒烬北行</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* 视觉：冻土上的蒸汽铁器。铆钉铁板做底，黄铜包边，熔炉橙是唯一的暖色，冰霜蓝只出现在边缘和寒冷警告上。 */
:root{
  --bg:#0e1319;
  --a-bg:rgba(20,27,36,.93);--a-panel:#161d26;--a-card:#1d2530;--a-line:rgba(170,200,230,.24);--a-hi:rgba(215,235,255,.14);
  --a-text:#e6edf3;--a-text2:#9fb0c0;--a-ember:#e8782a;--a-ember2:#ff9a3c;--a-ink:#1f1206;--a-bar:#111820;--a-good:#a8d8b0;--a-bad:#ff9a7c;
  --iron:#141b23;--iron2:#1d2530;--iron3:#283342;
  --brass:#8fa6bb;--brass-hi:#eef3f7;--brass-lo:#3a4a5c;
  --ember:#ff8a2b;--ember-hi:#ffc46b;--ember-lo:#a4421a;
  --frost:#a9d8ff;--frost-lo:#5f8db5;
  --text:#e6edf3;--muted:#9fb0c0;--line:rgba(170,200,230,.16);
  --good:#9fd47a;--bad:#ff6f55;--warn:#ffcb5c;
  --panel:linear-gradient(180deg,rgba(26,34,45,.98),rgba(18,24,32,.98));
  --plate:linear-gradient(180deg,rgba(33,42,54,.94),rgba(23,30,39,.94));
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --rivet:radial-gradient(circle at 35% 35%,#e6eef5 0,#8ea3b6 35%,#2a3644 75%,transparent 80%);
  --grain:linear-gradient(transparent,transparent);
  --brush:linear-gradient(transparent,transparent);
  --corner:linear-gradient(rgba(170,200,230,.4),rgba(170,200,230,.4));
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
/* 画面暗角 + 四角结霜 */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:
   radial-gradient(ellipse 120% 90% at 50% 45%,transparent 55%,rgba(8,14,24,.55) 100%),
   radial-gradient(circle at 0 0,rgba(214,236,255,.38),transparent 22%),
   radial-gradient(circle at 100% 0,rgba(214,236,255,.30),transparent 18%),
   radial-gradient(circle at 0 100%,rgba(214,236,255,.30),transparent 18%),
   radial-gradient(circle at 100% 100%,rgba(214,236,255,.34),transparent 20%)}
#vignette::after{content:'';position:absolute;inset:0;opacity:var(--night,0);
  background:radial-gradient(ellipse 115% 95% at 50% 45%,rgba(6,10,26,.12) 35%,rgba(4,8,22,.6) 100%)}
/* 极寒夜：屏幕四角结一层厚霜 */
#vignette::before{content:'';position:absolute;inset:0;opacity:var(--cold,0);z-index:1;
  background:
   radial-gradient(circle at 0 0,rgba(215,238,255,.75),rgba(180,218,252,.3) 15%,transparent 32%),
   radial-gradient(circle at 100% 0,rgba(215,238,255,.7),rgba(180,218,252,.26) 14%,transparent 29%),
   radial-gradient(circle at 0 100%,rgba(215,238,255,.7),rgba(180,218,252,.26) 14%,transparent 29%),
   radial-gradient(circle at 100% 100%,rgba(215,238,255,.75),rgba(180,218,252,.3) 15%,transparent 32%),
   radial-gradient(ellipse 120% 100% at 50% 50%,transparent 55%,rgba(140,190,240,.35) 100%)}
/* 冰风暴：斜着落下的冻雨 */
#sky .sleet{inset:calc(-10% - 1024px) -256px 0 0;opacity:var(--sleet,0);background-size:256px 256px;animation:sleet .9s linear infinite;background-color:rgba(150,180,210,.08);will-change:transform}
body.sleet-on #sky .sleet{display:block}
@keyframes sleet{from{transform:translate(0,0)}to{transform:translate(-256px,1024px)}}
/* 极光夜：屏幕上沿透进来的天光；冰雾：画面四周蒙一层白 */
#sky{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#sky i{position:absolute;display:none}
body.aur-on #sky .aur{display:block}
body.ice-on #sky .ice{display:block}
#sky .aur{left:-25%;right:-25%;top:-14%;height:60%;opacity:var(--aur,0);mix-blend-mode:screen;filter:blur(16px);
  background:
   radial-gradient(ellipse 16% 70% at 18% 8%,rgba(70,255,170,.55),transparent 70%),
   radial-gradient(ellipse 12% 64% at 34% 2%,rgba(60,235,190,.5),transparent 70%),
   radial-gradient(ellipse 20% 58% at 55% 0%,rgba(80,200,255,.42),transparent 70%),
   radial-gradient(ellipse 14% 70% at 72% 10%,rgba(90,255,160,.5),transparent 70%),
   radial-gradient(ellipse 18% 46% at 86% 16%,rgba(185,90,255,.38),transparent 70%),
   radial-gradient(ellipse 60% 40% at 50% 0%,rgba(40,140,130,.35),transparent 80%);
  -webkit-mask-image:linear-gradient(#000 0,#000 25%,transparent 100%);mask-image:linear-gradient(#000 0,#000 25%,transparent 100%);
  animation:aurSway 24s ease-in-out infinite alternate;transform-origin:50% 0}
#sky .aur.b{opacity:calc(var(--aur,0)*.75);animation-duration:31s;animation-direction:alternate-reverse;
  background:
   radial-gradient(ellipse 10% 66% at 26% 4%,rgba(120,255,200,.5),transparent 70%),
   radial-gradient(ellipse 13% 60% at 46% 10%,rgba(200,110,255,.36),transparent 70%),
   radial-gradient(ellipse 11% 70% at 64% 2%,rgba(70,255,150,.5),transparent 70%),
   radial-gradient(ellipse 9% 55% at 80% 6%,rgba(80,210,255,.42),transparent 70%)}
@keyframes aurSway{0%{transform:translateX(-5%) skewX(-10deg) scaleY(1)}50%{transform:translateX(2%) skewX(7deg) scaleY(1.15)}100%{transform:translateX(6%) skewX(-5deg) scaleY(.92)}}
#sky .ice{inset:0;opacity:var(--ice,0);background:
   radial-gradient(ellipse 130% 95% at 50% 62%,rgba(226,236,248,0) 38%,rgba(226,236,248,.42) 100%),
   linear-gradient(rgba(226,236,248,.34),rgba(226,236,248,0) 38%)}
/* 菜单：旅程卡 + 开关 + 存档 */
.mjour{position:relative;margin:2px 0 10px;padding:12px 14px 10px;border-radius:5px;border:1px solid var(--brass-lo);
  background:var(--rivet) 6px 6px/7px 7px no-repeat,var(--rivet) calc(100% - 6px) 6px/7px 7px no-repeat,var(--rivet) 6px calc(100% - 6px)/7px 7px no-repeat,var(--rivet) calc(100% - 6px) calc(100% - 6px)/7px 7px no-repeat,
   radial-gradient(ellipse 80% 70% at 15% 0,rgba(255,138,43,.16),transparent 70%),linear-gradient(180deg,#27313c,#161c22);
  box-shadow:inset 0 1px 0 rgba(242,207,143,.3),inset 0 0 0 1px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.35)}
.mjh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:0 4px}
.mjt{font-family:var(--serif);font-weight:900;font-size:21px;letter-spacing:.08em;color:var(--brass-hi);text-shadow:0 1px 0 #000,0 0 14px rgba(255,160,80,.25)}
.mje{flex:none;text-align:center;padding:4px 10px;border-radius:4px;background:rgba(0,0,0,.28);border:1px solid rgba(170,200,230,.3)}
.mje b{display:block;font-size:16px;color:var(--ember-hi)}.mje small{font-size:11px}
.route{position:relative;height:56px;margin:8px 18px 2px}
.route .rl{position:absolute;left:0;right:0;top:27px;height:3px;border-radius:2px;background:rgba(170,200,230,.25)}
.route .rl i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ember-lo),var(--ember) 80%,var(--ember-hi));box-shadow:0 0 8px rgba(255,138,43,.6)}
.rn{position:absolute;top:22px;width:0}
.rn em{position:absolute;left:-6px;top:0;width:12px;height:12px;transform:rotate(45deg);background:#1c232b;border:2px solid var(--brass-lo)}
.rn.seen em{border-color:var(--brass)}
.rn.on em{background:var(--ember);border-color:var(--ember-hi);box-shadow:0 0 8px rgba(255,138,43,.8)}
.rn.next em{border-color:var(--frost);animation:rnext 1.6s ease-in-out infinite}
@keyframes rnext{50%{box-shadow:0 0 0 4px rgba(169,216,255,.25)}}
.rn small{position:absolute;top:17px;left:0;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;line-height:1.2;color:var(--muted)}
.rn.up small{top:-17px}
.rn.on small{color:#ffd9a8}.rn.next small{color:var(--frost)}
.rn:first-child small{transform:translateX(-30%)}.rn:last-of-type small{transform:translateX(-70%)}
.mnext{font-size:12px;color:var(--muted);text-align:center;margin:0 0 8px}.mnext b{color:var(--frost);font-weight:700}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.mstats span{text-align:center;padding:6px 2px 5px;border-radius:4px;background:rgba(0,0,0,.25);border:1px solid rgba(170,200,230,.14);font-size:11.5px;color:var(--muted)}
.mstats b{display:block;font-family:var(--serif);font-size:17px;font-weight:900;color:#e6edf3;font-variant-numeric:tabular-nums}
.mstats .neg b{color:#ffb7a3}
.mlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;margin:4px 0;border-radius:4px;background:linear-gradient(180deg,rgba(47,60,73,.45),rgba(20,26,32,.45));border:1px solid rgba(170,200,230,.3)}
.mlink>span:first-child{font-size:20px}.mlink>span:nth-child(2){flex:1;font-weight:700}
.mlink small{display:block;font-weight:400;font-size:12px}.mlink i{font-style:normal;font-size:20px;color:var(--brass)}
.mlink:hover{border-color:rgba(242,207,143,.6)}
.tgls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.tgl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:4px;text-align:left;background:rgba(0,0,0,.22);border:1px solid rgba(170,200,230,.22)}
.tgl .ti{font-size:18px;opacity:.55}.tgl .tt{flex:1;font-weight:700;min-width:0}.tgl .tt small{display:block;font-weight:400;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgl .sw{flex:none;position:relative;width:34px;height:18px;border-radius:9px;background:#0d1115;border:1px solid var(--brass-lo);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.tgl .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9db2c8,#465768);transition:left .15s}
.tgl.on{border-color:rgba(255,138,43,.55)}.tgl.on .ti{opacity:1}
.tgl.on .sw{background:linear-gradient(180deg,#c95a1e,#ff9a3c);border-color:var(--ember-lo)}
.tgl.on .sw::after{left:18px;background:radial-gradient(circle at 40% 35%,#fff3dc,#f2cf8f)}
.mlab{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 5px;font-weight:700}.mlab small{font-weight:400}
.msave{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:4px;background:rgba(0,0,0,.22);border:1px solid rgba(170,200,230,.14);font-weight:700}
.msave .msi{font-size:20px}.msave em{font-style:normal;font-weight:400;color:var(--good);font-size:12px;margin-left:6px}.msave small{display:block;font-weight:400;font-size:12px;margin-top:2px}
.mdanger{margin-top:14px;padding-top:10px;border-top:1px dashed rgba(255,111,85,.3)}
.mdanger .btn.ghost{width:100%;color:#ffb7a3;border-color:rgba(255,111,85,.35)}
.mdanger .btn.ghost:hover{background:rgba(255,111,85,.08)}
.mfoot{text-align:center;font-size:11px;color:rgba(159,176,192,.6);margin-top:10px;font-family:var(--serif);letter-spacing:.2em}
/* 人心：顶部小药丸、面板里的两条大表、因素表、律令卡 */
.mood2{display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
.mg{padding:9px 11px;border-radius:5px;background:rgba(0,0,0,.25);border:1px solid rgba(170,200,230,.2)}
.mgh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}.mgh span{font-family:var(--serif);font-weight:900;letter-spacing:.1em;color:var(--brass-hi)}
.mgh b{font-family:var(--serif);font-size:24px;font-weight:900;line-height:1}
.mgh small{margin-left:auto}.mgh small.up{color:var(--good)}.mgh small.dn{color:#ffb7a3}
.mg.disc .mgh small.up{color:#ffb7a3}.mg.disc .mgh small.dn{color:var(--good)}
.mg.hope .mgh b{color:var(--ember-hi)}.mg.disc .mgh b{color:#ff9a85}
.mbar{position:relative;height:10px;border-radius:5px;background:#0d1115;border:1px solid rgba(170,200,230,.25);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.mbar>i{display:block;height:100%;border-radius:5px}
.twsteps{display:flex;align-items:center;gap:6px;margin:8px 0 10px;font-size:13px;flex-wrap:wrap}
.twsteps span{padding:3px 10px;border-radius:999px;border:1px solid rgba(170,200,230,.3);background:rgba(0,0,0,.22);color:#88a1bc}
.twsteps span.ok{color:#a6d982;border-color:rgba(166,217,130,.45)}
.twsteps span.on{color:#ffd27a;border-color:#ffb040;box-shadow:0 0 8px rgba(255,160,60,.35)}
.twsteps i{opacity:.45;font-style:normal}
.mbar.tw{margin:2px 0 8px}.mbar.tw>i{background:linear-gradient(90deg,#b8742a,#ffb040 70%,#ffe2a0);box-shadow:0 0 8px rgba(255,160,60,.45)}
.mg.hope .mbar>i{background:linear-gradient(90deg,var(--ember-lo),var(--ember) 70%,var(--ember-hi));box-shadow:0 0 8px rgba(255,138,43,.45)}
.mg.disc .mbar>i{background:linear-gradient(90deg,#5a1e14,#c8432c 70%,#ff6f55)}
.mbar em{position:absolute;top:-4px;width:2px;height:16px;margin-left:-1px;background:#fff3dc;box-shadow:0 0 4px rgba(255,240,210,.9)}
.mbar u{position:absolute;top:-2px;bottom:-2px;width:0;border-left:1px dashed rgba(255,111,85,.8)}
.mnow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}.mnow b{color:#e6edf3}.mnow b.neg{color:#ffb7a3}
.mfac>div{display:grid;grid-template-columns:1fr 64px 64px;padding:5px 0;border-bottom:1px solid rgba(170,200,230,.1);font-size:13px}
.mfac>div>span:not(:first-child){text-align:center}.mfac .mfh{color:var(--muted);font-size:11.5px;padding-top:0}
.mfac .mfb{color:var(--muted)}.mfac b.pos{color:var(--good)}.mfac b.neg{color:#ffb7a3}.mfac i{color:rgba(159,176,192,.4);font-style:normal}
.laws{display:flex;flex-direction:column;gap:7px}
.law{padding:9px 10px;border-radius:5px;background:linear-gradient(180deg,rgba(47,60,73,.35),rgba(20,26,32,.35));border:1px solid rgba(170,200,230,.22)}
.law.on{border-color:rgba(255,138,43,.6);background:radial-gradient(ellipse 70% 90% at 0 0,rgba(255,138,43,.14),transparent 70%),linear-gradient(180deg,rgba(47,60,73,.45),rgba(20,26,32,.45))}
.lh{display:flex;align-items:center;gap:8px}.lh .li{font-size:18px}.lh b{font-family:var(--serif);font-size:15px;letter-spacing:.06em}
.lh .lon{font-size:11px;color:var(--ember-hi);border:1px solid rgba(255,138,43,.5);border-radius:3px;padding:0 5px}
.lh button{margin-left:auto;white-space:nowrap}
.ld{font-size:12.5px;color:var(--muted);margin:4px 0 5px}
.lfx{display:flex;flex-direction:column;gap:2px;font-size:12.5px}.lfx .g{color:var(--good)}.lfx .g::before{content:"＋ "}.lfx .b{color:#ffb7a3}.lfx .b::before{content:"－ "}
/* 研究 */
.tcur{padding:10px 11px;border-radius:5px;background:rgba(0,0,0,.25);border:1px solid rgba(255,138,43,.45);margin:2px 0 8px}
.tcur.idle{border-color:rgba(170,200,230,.22)}.tcur.idle small{display:block;margin-top:2px}
.tch{display:flex;gap:10px;align-items:center;margin-bottom:8px}.tch .ti{font-size:24px}.tch b{font-family:var(--serif);font-size:16px}.tch small{display:block}
.tcur .mbar>i{background:linear-gradient(90deg,var(--ember-lo),var(--ember) 70%,var(--ember-hi));box-shadow:0 0 8px rgba(255,138,43,.45)}
.tcm{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;font-size:12.5px;color:var(--muted)}.tcm b.neg{color:#ffb7a3}.tcm button{white-space:nowrap}
.techs{display:flex;flex-direction:column;gap:6px}
.tech{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:5px;background:linear-gradient(180deg,rgba(47,60,73,.35),rgba(20,26,32,.35));border:1px solid rgba(170,200,230,.22)}
.tech .ti{font-size:20px;width:26px;text-align:center}.tech .tb{flex:1;min-width:0}.tech .tb b{font-weight:700}.tech .tb small{display:block}
.tech .tcost{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
.tech .ta{flex:none;text-align:right;max-width:110px}
.tech.done{opacity:.6;border-color:rgba(159,212,122,.35)}.tech .tdone{color:var(--good);font-size:12px;font-weight:700}.tech .tdone.cur{color:var(--ember-hi)}
.tech.cur{border-color:rgba(255,138,43,.6)}
.ttree{position:relative;margin:4px 0 6px}
.ttree svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.ttree path{fill:none;stroke:rgba(159,176,192,.28);stroke-width:2;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.ttree path.open{stroke:rgba(255,138,43,.55);stroke-dasharray:none}.ttree path.done{stroke:var(--brass);stroke-dasharray:none}
.tnode{position:absolute;width:76px;margin-left:-38px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;padding:0}
.tnode .tn0{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:24px;
  background:radial-gradient(circle at 50% 35%,#313f4d,#14191f 75%);border:2px solid rgba(170,200,230,.4);box-shadow:inset 0 1px 0 rgba(255,220,160,.2),0 2px 6px rgba(0,0,0,.5)}
.tnode .tnl{font-size:11.5px;line-height:1.25;color:var(--text);text-align:center;max-width:76px;text-shadow:0 1px 2px #000}
.tnode .tbadge{position:absolute;top:-2px;left:calc(50% + 12px);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;color:#1f3312;background:var(--good);box-shadow:0 0 0 2px #14191f}
.tnode .tbadge.lk{background:#28333e;color:var(--muted);font-size:10px}
.tnode.done .tn0{border-color:var(--brass);background:radial-gradient(circle at 50% 35%,#3e4e5e,#192027 75%)}
.tnode.ok .tn0{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,138,43,.18),0 0 14px rgba(255,138,43,.45);animation:tglow 2s ease-in-out infinite}
@keyframes tglow{50%{box-shadow:0 0 0 5px rgba(255,138,43,.1),0 0 20px rgba(255,138,43,.6)}}
.tnode.cur .tn0{border-color:transparent;background:radial-gradient(circle at 50% 35%,#313f4d,#14191f 62%,transparent 63%),conic-gradient(var(--ember-hi) calc(var(--p)*360deg),rgba(255,255,255,.1) 0)}
.tnode.lock .tn0{filter:grayscale(.85) brightness(.7);border-style:dashed}.tnode.lock .tnl{color:var(--muted)}
.tnode.sel .tn0{outline:2px solid var(--brass-hi);outline-offset:3px}
.tnode.sel .tnl{color:var(--brass-hi);font-weight:700}
.tdet{margin:2px 0 8px;padding:10px 12px;border-radius:6px;border:1px solid rgba(170,200,230,.4);background:linear-gradient(180deg,rgba(44,57,70,.45),rgba(19,24,29,.45));position:relative}
.tdet::before{content:"";position:absolute;left:var(--ax,50%);top:-7px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:#25303b;border-left:1px solid rgba(170,200,230,.4);border-top:1px solid rgba(170,200,230,.4)}
.tdet .tdh{display:flex;gap:10px;align-items:center}.tdet .ti{font-size:24px}.tdet b{font-family:var(--serif);font-size:15px}.tdet small{display:block}
.tdet .tcost{margin:8px 0 2px;display:flex;flex-wrap:wrap;gap:6px}
.tdet .tda{display:flex;justify-content:flex-end;margin-top:6px}.tdet .tda .btn{margin:0;min-width:120px}
.tdet.done{border-color:rgba(159,212,122,.35)}
.rhd{display:grid;grid-template-columns:repeat(5,1fr);margin:10px 0 2px;border-bottom:1px solid rgba(170,200,230,.14);padding-bottom:6px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- 1.1 霜铁暖灯：面板、按钮、弹窗、提示换皮（放在最后，盖过上面的旧样式） ---------- */
#sheet{background:linear-gradient(180deg,#1b232e,#141b23 240px);border:1px solid rgba(170,200,230,.22);box-shadow:inset 0 1px 0 rgba(215,235,255,.12),0 -6px 24px rgba(4,8,14,.55);scrollbar-color:#3a4a5c transparent;scrollbar-width:thin}
@media (orientation:portrait),(max-width:760px){#sheet{border-radius:16px 16px 0 0;border-bottom:0}
  .phead::before{background:rgba(170,200,230,.35);box-shadow:none}}
@media (orientation:landscape) and (min-width:761px){#sheet{border-radius:16px}}
.phead{background:linear-gradient(180deg,#202a36,#1a222d);border-bottom:1px solid rgba(170,200,230,.16);box-shadow:0 6px 12px -8px rgba(4,8,14,.6);border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0}
/* 面板顶上积的一层雪 */
.phead::after{top:-1px;left:10px;right:10px;height:7px;opacity:1;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='7' viewBox='0 0 120 7' preserveAspectRatio='none'><path d='M0 0H120V2Q114 6 106 4T92 5 78 3 64 5 50 3 36 5 22 3 10 5 0 3Z' fill='%23e3eaf0' fill-opacity='.92'/></svg>") 0 0/120px 7px repeat-x;filter:drop-shadow(0 1px 1px rgba(4,8,14,.35));pointer-events:none}
.phead b{font-size:18px;font-weight:700;letter-spacing:.06em;color:#f2f6f9;text-shadow:none}
.phead b small{color:var(--a-text2);font-size:12.5px}
.phead .x,.phead .bk{width:36px;height:36px;border-radius:50%;color:#c9d5df;background:rgba(255,255,255,.06);border:1px solid rgba(170,200,230,.22);box-shadow:none}
.phead .x:hover,.phead .bk:hover{background:rgba(255,255,255,.1)}
.ptabs{gap:0;margin-top:6px}
.ptabs button{font:600 13.5px var(--sans);letter-spacing:.06em;color:var(--a-text2);padding:9px 0 10px}
.ptabs button.on{color:#f2f6f9;border-bottom-color:var(--a-ember2);text-shadow:none}
.pbody{padding:12px 14px 20px}
.sec{font-weight:700;font-size:15px;color:#eef3f7;letter-spacing:.06em;margin:16px 0 8px}
.sec::after{background:linear-gradient(90deg,rgba(170,200,230,.24),transparent)}
.sec small,.sec .small{font-family:var(--sans);font-weight:400;letter-spacing:0;color:var(--a-text2)}
.desc,.hint{color:var(--a-text2)}
.story{color:#ffdcb4;border-left-color:rgba(255,154,60,.5)}
/* 按钮：普通是冷铁，主按钮是暖橙 */
.btn{color:#e6edf3;padding:10px 14px;min-height:40px;border-radius:10px;letter-spacing:.02em;background:#263040;border:1px solid rgba(170,200,230,.22);box-shadow:inset 0 1px 0 rgba(215,235,255,.08)}
.btn:hover{background:#2c384a}
.btn.go{color:var(--a-ink);background:linear-gradient(180deg,#ffa54e,#e8782a);border:1px solid #c45f1c;text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,225,190,.55),0 2px 8px rgba(232,120,42,.25)}
.btn.go:hover{background:linear-gradient(180deg,#ffb062,#ee8232)}
.btn.bad{color:#fff;background:#8a2f1e;border-color:#5a1a10}
.btn.ghost{background:transparent;border:1px solid rgba(170,200,230,.22);color:var(--a-text2)}
.btn[disabled],.btn.off{opacity:.45}
.bar{height:8px;background:#0f151c;border:1px solid rgba(170,200,230,.14);border-radius:5px}
.bar i{background:linear-gradient(90deg,#c45f1c,var(--a-ember2));box-shadow:none;border-radius:4px}
/* 弹窗 */
.mbox{background:linear-gradient(180deg,#1d2632,#151c25)!important;border:1px solid rgba(170,200,230,.24);border-radius:16px;box-shadow:inset 0 1px 0 rgba(215,235,255,.12),0 14px 40px rgba(2,4,8,.7)}
.mbox h2{color:#f2f6f9;font-weight:700;text-shadow:none}
.mbox h2::after{background:linear-gradient(90deg,rgba(170,200,230,.3),transparent)}
.mbox h3{color:#eef3f7}
/* 提示条 */
/* 地图上的营地牌子：深色铁牌，白字 */
.camptag{color:#f2f6f9;background:rgba(20,27,36,.9);border:1px solid rgba(170,200,230,.35);border-radius:6px;box-shadow:0 2px 6px rgba(4,8,14,.5),0 0 12px rgba(255,138,43,.25)}
.camptag small{color:#ffc38f}
.camptag .ctfull{background:var(--a-ember2);color:var(--a-ink)}
.camptag .cttl{color:#f0c27a} /* 称号：深色底上换成暖金色，原来的深棕看不清 */
.lmtag{background:rgba(20,27,36,.9);border-color:rgba(170,200,230,.35);color:#eef3f7;border-radius:6px}
.sitetag{border-radius:6px}
/* 物流：营地卡、道路卡、送货的选择条 */
.ncard{margin:8px 0;padding:10px 12px;border-radius:12px;background:#1b2430;border:1px solid rgba(170,200,230,.16)}
.ncard.on{border-color:rgba(255,154,60,.55);box-shadow:inset 0 0 0 1px rgba(255,154,60,.18)}
.ncard.jam{border-color:rgba(255,203,92,.55);background:linear-gradient(180deg,rgba(255,203,92,.07),#1b2430)}
.ncard .nh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.ncard .nh b{font-size:14.5px;color:#f2f6f9}.ncard .nh small{color:var(--a-text2);font-size:12px;flex:1}
.ncard .nl{display:grid;grid-template-columns:minmax(2.6em,max-content) 1fr;gap:8px;padding:3px 0;font-size:13px;line-height:1.55}.ncard .nl>span:first-child{color:var(--a-text2)}
.ncard .nl small{color:var(--a-text2)}.ncard .nl i{font-style:normal}.ncard .nl i.bad{color:#ff9b85}.ncard .nl i.warn,.ncard .nl.warn{color:#ffcb5c}
.ncard .bar{margin:4px 0 6px}
.achips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px}.achip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 9px;border:1px solid rgba(170,200,230,.22);border-radius:10px;background:#222c39;color:#e6edf3;font:inherit;font-size:13px;cursor:pointer;text-align:left}.achip small{color:#9fb0c2;font-size:12px}.achip.on{border-color:#ff9a3c;background:rgba(255,154,60,.16)}.achip.on small{color:#ffd2a6}.achip:disabled{opacity:.5;cursor:default}.achip.on:disabled{opacity:1}.ghero{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin:2px 0 8px;border:1px solid rgba(170,200,230,.22);border-radius:12px;background:linear-gradient(180deg,#26303e,#1d2530)}.ghero b{font-size:22px;color:#ffc98f;display:flex;align-items:center;gap:4px}.ghero small{display:block;color:#9fb0c2;font-size:12px}.grow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(170,200,230,.1)}.gk{display:flex;align-items:center;gap:8px;min-width:0}.gk>span{display:flex;flex-direction:column;min-width:0}.gk small{color:#9fb0c2;font-size:12px}.gk i{font-style:normal;color:#c9d4df}.gk i.pos{color:#8fe0a0}.gk i.neg{color:#f0a08a}.gb{display:flex;gap:5px;flex-wrap:nowrap;flex:none;justify-content:flex-end;align-items:center}.gb button{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:4px 8px;min-width:0}.gb button small{font-size:11px;color:#c9d4df}.gord{padding:9px 10px;margin:6px 0;border:1px solid rgba(170,200,230,.2);border-radius:10px;background:#222c39}.gord.ok{border-color:rgba(255,154,60,.6)}.gord .gb{justify-content:space-between;margin-top:6px}.gord .gb small{color:#9fb0c2}.gbar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}.gbar i{display:block;height:100%;background:#ff9a3c;border-radius:3px}.gdeco{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin:4px 0 8px}.gdc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border:1px solid rgba(170,200,230,.2);border-radius:10px;background:#222c39;text-align:center}.gdc small{color:#9fb0c2;font-size:11px}.gdc small.ok{color:#8fe0a0}.gdc.have{border-color:rgba(143,224,160,.4)}.gdc .ico,.gdc .pic{width:44px;height:44px}.gdc .th{width:52px;height:52px;flex:none;border-radius:8px;background-color:rgba(255,255,255,.04)}
.skst{font-style:normal;font-size:12px;color:#ffb35c;letter-spacing:1px;margin-left:4px;vertical-align:2px}.skst span{color:rgba(170,200,230,.25)}
.spec-tag{display:inline-block;margin-left:4px;padding:0 5px;border-radius:6px;background:rgba(255,154,60,.18);color:#ffc98f;font-size:11px;font-style:normal;vertical-align:1px}
.dchip{color:#e6edf3;background:#222c39;border-color:rgba(170,200,230,.22)}.dchip.on{border-color:#ff9a3c;background:rgba(255,154,60,.18);color:#fff3e4}.dchip.on small{color:#ffd2a6}
.drow .dl{align-self:center;color:var(--a-text2);font-size:12.5px;white-space:nowrap}
.row i.bad{color:#ff9b85;font-style:normal}.row i.warn{color:#ffcb5c;font-style:normal}
/* 线条图标：比低多边形的小一点，物资带淡色；纸条和暖橙按钮上跟文字同色 */
.ic.ln{width:1.25em;height:1.25em;vertical-align:-.26em;margin:-.12em .1em -.12em 0}
.btn.go .ic.ln,.tk .btn .ic.ln{color:inherit!important}
.pfbar{position:sticky;bottom:0;z-index:1;display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,27,35,0),#141b23 16px)}
.pfbar .btn{flex:1;margin:0;min-height:46px}.pfbar .btn.go{flex:1.4}
.pfoot{margin-bottom:-20px;background:linear-gradient(180deg,#222c38,#19212b);border-top:1px solid rgba(170,200,230,.18);box-shadow:0 -6px 14px rgba(4,8,14,.35)}
@media (orientation:portrait),(max-width:760px){#sheet{padding-bottom:0}}
/* 常用的面板零件：卡片、行、小按钮、分页 */
.mlink{border-radius:12px;background:var(--a-card);border:1px solid rgba(170,200,230,.16);padding:12px 14px}
.mlink:hover{border-color:rgba(170,200,230,.4)}.mlink i{color:var(--a-text2)}
.mlink.book{border-color:rgba(255,154,60,.45)}.mlink .mnew{background:var(--a-ember2);color:var(--a-ink)}
.row{border-bottom-color:rgba(170,200,230,.1)}
.issue{border-radius:12px;padding:10px 12px;background:var(--a-card);border:1px solid rgba(170,200,230,.12);border-left:3px solid rgba(170,200,230,.35)}
.issue.bad{border-color:rgba(255,120,90,.35);border-left-color:#ff7a5c;background:rgba(90,34,26,.35)}.issue.warn{border-color:rgba(255,196,107,.28);border-left-color:var(--warn);background:rgba(80,62,24,.25)}.issue.ok{border-left-color:var(--a-good)}
.issue .it small{color:var(--a-text2)}
button.small{color:#e6edf3;background:#263040;border:1px solid rgba(170,200,230,.22);padding:6px 11px;border-radius:8px;font-size:12.5px}
button.small.go{color:var(--a-ink);background:linear-gradient(180deg,#ffa54e,#e8782a);border-color:#c45f1c;font-weight:700}
button.small.ghost{border-color:rgba(170,200,230,.22);color:var(--a-text2)}
.tab{color:var(--a-text2);background:rgba(255,255,255,.04);border:1px solid rgba(170,200,230,.16);padding:6px 12px;border-radius:16px}
.tab.on{color:#f2f6f9;font-family:var(--sans);font-weight:700;background:#2c384a;border-color:rgba(255,154,60,.7)}
.tab.hasnew::after{background:var(--a-ember2);box-shadow:none}
.card{background:var(--a-card);border:1px solid rgba(170,200,230,.14);border-radius:12px;padding:10px}
.card.on{border-color:var(--a-ember2)}.card:not(.locked):active{background:#243041}
.card.short{border-color:rgba(255,120,90,.3);background:linear-gradient(180deg,rgba(70,36,32,.45),rgba(29,37,48,.9))}.card.short .cn{color:#e6edf3}
.lrow{border-radius:8px;background:rgba(255,255,255,.035);border-left-color:rgba(170,200,230,.35)}
.lday{color:var(--a-text2)}.lday::after{background:linear-gradient(90deg,rgba(170,200,230,.24),transparent)}
.chrow .chbtn{border-radius:10px}
.sumgrid span{border-color:rgba(170,200,230,.16);border-radius:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sky"><i class="aur"></i><i class="aur b"></i><i class="ice"></i><i class="sleet"></i></div>
<div id="vignette"></div>
<div id="floats"></div>
<div id="labels"></div>
<div id="top">
  <div class="r1"><button id="campName" class="hpl" data-act="campBtn"><span class="cn">营地</span><span class="csub"></span><svg class="svg cv" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button><div id="vitals"></div></div>
  <div class="r2"><div id="goal" class="hpl"></div><button id="bellBtn" class="hpl" data-act="bell" title="提醒与消息" aria-label="提醒"><svg class="hic" aria-hidden="true"><use href="#c-ui_bell"/></svg><i class="bn"></i></button></div>
</div>
<div id="toasts"></div>
<div id="pausebar" data-act="pause">⏸ 已暂停 <small style="font:400 11.5px var(--sans);letter-spacing:0;color:var(--a-text2)">点这里继续</small></div>
<div id="note"></div>
<div id="side">
  <button id="menuBtn" data-act="hub" data-arg="menu" title="菜单" aria-label="菜单"><svg class="hic" aria-hidden="true"><use href="#c-ui_menu"/></svg></button>
  <button id="speedBtn" data-act="speed" title="加速（点一下换倍速，按住暂停）" aria-label="速度"><svg class="hic sp" aria-hidden="true"><use href="#c-ui_speed"/></svg><svg class="hic ps" aria-hidden="true"><use href="#c-ui_pause"/></svg><i>1×</i></button>
  <button id="mapBtn" data-act="bigmap" title="北行地图（M）" aria-label="北行地图"><svg class="hic" aria-hidden="true"><use href="#c-ui_map"/></svg><span class="pl">北行地图<kbd>M</kbd></span></button>
  <button id="homeBtn" title="回到炉火（空格）" aria-label="回到炉火"><svg class="hic" aria-hidden="true"><use href="#c-ui_home"/></svg><span class="pl">回到炉火<kbd>空格</kbd></span></button>
</div>
<div id="cmdbar"></div>
<div id="toolbar">
  <button id="tbCamp" data-act="hub" data-arg="camp"><span><svg class="hic" aria-hidden="true"><use href="#c-hub_camp"/></svg></span><em class="tl">营地<kbd class="pk">1</kbd></em></button>
  <button id="tbProd" data-act="hub" data-arg="prod"><span><svg class="hic" aria-hidden="true"><use href="#c-hub_prod"/></svg></span><em class="tl">生产<kbd class="pk">2</kbd></em></button>
  <button id="tbBuild" class="main" data-act="hub" data-arg="build"><span><svg class="hic" aria-hidden="true"><use href="#c-hub_build"/></svg></span><em class="tl">建造<kbd class="pk">3</kbd></em></button>
  <button id="tbResearch" data-act="hub" data-arg="research"><span><svg class="hic" aria-hidden="true"><use href="#c-hub_research"/></svg></span><em class="tl">研究<kbd class="pk">4</kbd></em><i class="tbp"></i></button>
  <button id="tbNorth" data-act="hub" data-arg="north"><span><svg class="hic" aria-hidden="true"><use href="#c-hub_north"/></svg></span><em class="tl">北行<kbd class="pk">5</kbd></em></button>
</div>
<div id="placebar">
  <div class="pic" id="placePic"></div><div><div class="nm" id="placeName"></div><div class="pc" id="placeCost"></div></div>
  <button id="placeRow" title="连续摆一排">一排</button>
  <button id="placeNo" title="取消">✕</button>
  <button id="placeOk" title="确认建造">✓</button>
</div>
<div id="sheet"></div>
<div id="bigmap"></div>
<div id="chainmap"></div>
<div id="title"></div>
<div id="modal"></div>
<div id="loading"><svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="#ffb05a" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2.5c.8 4 6 5.5 6 11.5a6 6 0 01-12 0c0-3 1.8-4.3 2.3-6.5 1.4 1.2 2 2.6 2 4.2C11.6 9.5 12.6 6.5 12 2.5z"/></svg>寒烬北行<small>正在点燃熔炉…</small></div>
<script>/*BUNDLE*/</script>
<script>document.getElementById('loading').remove();</script>
</body>
</html>
